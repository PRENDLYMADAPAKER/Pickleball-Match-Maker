<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickleball Queue & Matchmaker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 850px) { .container { grid-template-columns: 1.2fr 0.8fr; } }

    header { text-align: center; margin-bottom: 10px; grid-column: 1 / -1; }
    header h1 { font-size: 2rem; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 10px; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .card h2 { font-size: 1.25rem; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

    /* Controls Form */
    .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 10px 14px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 1rem; }
    button { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); color: #fff; padding: 4px 8px; font-size: 0.8rem; }

    .mode-selector { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; background: var(--bg-color); padding: 10px; border-radius: 8px; }
    .mode-selector label { cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 500; }

    /* Active Match Card */
    .active-match-box { background: var(--bg-color); border: 2px dashed var(--accent); border-radius: 10px; padding: 15px; text-align: center; }
    .match-teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: center; margin: 15px 0; }
    .team { background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
    .vs { font-weight: bold; color: var(--accent); font-size: 1.2rem; }
    .team-players { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }

    /* Player Queue List */
    .player-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
    .player-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border-color); }
    .tag { background: var(--border-color); padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; color: var(--text-muted); }

    /* Standings Table */
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; }
    th { color: var(--text-muted); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .win-rate { font-weight: bold; color: var(--accent); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🏓 Pickleball Queue Matchmaker</h1>
      <p>Equal-play court rotation & individual standings manager</p>
    </header>

    <!-- LEFT COLUMN: Match Generation & Queue -->
    <div>
      <!-- Controls -->
      <div class="card">
        <h2>Queue Controls</h2>
        <div class="input-group">
          <input type="text" id="playerNameInput" placeholder="Enter player name..." onkeydown="if(event.key==='Enter') addPlayer()">
          <button class="btn-primary" onclick="addPlayer()">Add Player</button>
        </div>

        <div class="mode-selector">
          <span>Match Format:</span>
          <label><input type="radio" name="matchMode" value="doubles" checked> Doubles (4 Players)</label>
          <label><input type="radio" name="matchMode" value="singles"> Singles (2 Players)</label>
        </div>

        <button class="btn-primary" style="width: 100%; font-size: 1.05rem;" onclick="generateMatch()">⚡ Generate Next Match</button>
      </div>

      <!-- Active Match -->
      <div class="card">
        <h2>Current Court</h2>
        <div id="activeMatchContainer">
          <p style="text-align: center; color: var(--text-muted);">No active match. Select a format and click "Generate Next Match".</p>
        </div>
      </div>

      <!-- Waiting Queue -->
      <div class="card">
        <h2>Waiting Queue (<span id="queueCount">0</span>)</h2>
        <ul id="playerQueue" class="player-list"></ul>
      </div>
    </div>

    <!-- RIGHT COLUMN: Standings -->
    <div>
      <div class="card">
        <h2>Individual Standings</h2>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>Played</th>
              <th>W-L</th>
              <th>Win %</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="standingsTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // State
    let players = [
      { id: 1, name: "Alex", matchesPlayed: 0, wins: 0, losses: 0, playing: false },
      { id: 2, name: "Jordan", matchesPlayed: 0, wins: 0, losses: 0, playing: false },
      { id: 3, name: "Sam", matchesPlayed: 0, wins: 0, losses: 0, playing: false },
      { id: 4, name: "Taylor", matchesPlayed: 0, wins: 0, losses: 0, playing: false },
      { id: 5, name: "Morgan", matchesPlayed: 0, wins: 0, losses: 0, playing: false },
      { id: 6, name: "Casey", matchesPlayed: 0, wins: 0, losses: 0, playing: false }
    ];
    let activeMatch = null;

    // Add Player
    function addPlayer() {
      const input = document.getElementById('playerNameInput');
      const name = input.value.trim();
      if (!name) return;

      players.push({
        id: Date.now(),
        name,
        matchesPlayed: 0,
        wins: 0,
        losses: 0,
        playing: false
      });

      input.value = '';
      render();
    }

    // Remove Player
    function removePlayer(id) {
      if (activeMatch && activeMatch.players.some(p => p.id === id)) {
        alert("Cannot remove a player currently in an active match.");
        return;
      }
      players = players.filter(p => p.id !== id);
      render();
    }

    // Matchmaking Logic (Prioritizes fewest matches played)
    function generateMatch() {
      if (activeMatch) {
        alert("Please complete the current match before generating a new one.");
        return;
      }

      const mode = document.querySelector('input[name="matchMode"]:checked').value;
      const requiredPlayers = mode === 'doubles' ? 4 : 2;

      // Filter available players
      const availablePlayers = players.filter(p => !p.playing);

      if (availablePlayers.length < requiredPlayers) {
        alert(`Need at least ${requiredPlayers} available players to start a ${mode} match.`);
        return;
      }

      // Sort by matches played (ASC) for equal play court rotation
      availablePlayers.sort((a, b) => a.matchesPlayed - b.matchesPlayed);

      // Pick top N players
      const selected = availablePlayers.slice(0, requiredPlayers);

      // Set status to playing
      selected.forEach(p => p.playing = true);

      // Distribute teams
      let team1, team2;
      if (mode === 'doubles') {
        team1 = [selected[0], selected[3]]; // Mix high/low for parity
        team2 = [selected[1], selected[2]];
      } else {
        team1 = [selected[0]];
        team2 = [selected[1]];
      }

      activeMatch = { mode, team1, team2, players: selected };
      render();
    }

    // Complete Match
    function recordWinner(winningTeamNumber) {
      if (!activeMatch) return;

      const winners = winningTeamNumber === 1 ? activeMatch.team1 : activeMatch.team2;
      const losers = winningTeamNumber === 1 ? activeMatch.team2 : activeMatch.team1;

      winners.forEach(p => {
        const player = players.find(x => x.id === p.id);
        if (player) {
          player.wins++;
          player.matchesPlayed++;
          player.playing = false;
        }
      });

      losers.forEach(p => {
        const player = players.find(x => x.id === p.id);
        if (player) {
          player.losses++;
          player.matchesPlayed++;
          player.playing = false;
        }
      });

      activeMatch = null;
      render();
    }

    // Render Functions
    function render() {
      renderActiveMatch();
      renderQueue();
      renderStandings();
    }

    function renderActiveMatch() {
      const container = document.getElementById('activeMatchContainer');
      if (!activeMatch) {
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted);">No active match. Select a format and click "Generate Next Match".</p>`;
        return;
      }

      const t1Names = activeMatch.team1.map(p => p.name).join(' & ');
      const t2Names = activeMatch.team2.map(p => p.name).join(' & ');

      container.innerHTML = `
        <div class="active-match-box">
          <span class="tag" style="text-transform: uppercase;">${activeMatch.mode} Match</span>
          <div class="match-teams">
            <div class="team">
              <div class="team-players">${t1Names}</div>
              <button class="btn-primary" onclick="recordWinner(1)">Team 1 Won</button>
            </div>
            <div class="vs">VS</div>
            <div class="team">
              <div class="team-players">${t2Names}</div>
              <button class="btn-primary" onclick="recordWinner(2)">Team 2 Won</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderQueue() {
      const queueList = document.getElementById('playerQueue');
      const queueCount = document.getElementById('queueCount');
      
      const available = players.filter(p => !p.playing);
      // Sort queue by matches played so users see who is next up
      available.sort((a, b) => a.matchesPlayed - b.matchesPlayed);

      queueCount.textContent = available.length;
      queueList.innerHTML = '';

      if (available.length === 0) {
        queueList.innerHTML = `<li style="color: var(--text-muted); text-align: center; padding: 10px;">All players are currently on court or queue is empty.</li>`;
        return;
      }

      available.forEach(p => {
        const li = document.createElement('li');
        li.className = 'player-item';
        li.innerHTML = `
          <div>
            <strong>${p.name}</strong>
          </div>
          <div style="display: flex; gap: 10px; align-items: center;">
            <span class="tag">${p.matchesPlayed} games played</span>
            <button class="btn-danger" onclick="removePlayer(${p.id})">✕</button>
          </div>
        `;
        queueList.appendChild(li);
      });
    }

    function renderStandings() {
      const tbody = document.getElementById('standingsTable');
      tbody.innerHTML = '';

      // Copy and sort by wins (DESC), then win rate (DESC)
      const sorted = [...players].sort((a, b) => {
        const winRateA = a.matchesPlayed > 0 ? (a.wins / a.matchesPlayed) : 0;
        const winRateB = b.matchesPlayed > 0 ? (b.wins / b.matchesPlayed) : 0;
        
        if (b.wins !== a.wins) return b.wins - a.wins;
        return winRateB - winRateA;
      });

      sorted.forEach((p, index) => {
        const winRate = p.matchesPlayed > 0 ? ((p.wins / p.matchesPlayed) * 100).toFixed(0) : 0;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color: var(--text-muted);">${index + 1}</td>
          <td><strong>${p.name}</strong> ${p.playing ? '🎾' : ''}</td>
          <td>${p.matchesPlayed}</td>
          <td>${p.wins}-${p.losses}</td>
          <td class="win-rate">${winRate}%</td>
          <td><button class="btn-danger" onclick="removePlayer(${p.id})">✕</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Initial Load
    render();
  </script>
</body>
</html>
